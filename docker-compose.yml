services:

 postgres_db:
  image: postgres:15
  container_name: postgres_db
  restart: always
  environment:
   POSTGRES_USER: desguace_user
   POSTGRES_PASSWORD: desguace_password
   POSTGRES_DB: desguace_db
  ports:
   - "5432:5432"
  volumes:
   - postgres_data:/var/lib/postgresql/data

 pgadmin_ui:
  image: dpage/pgadmin4
  container_name: pgadmin_ui
  restart: always
  environment:
   PGADMIN_DEFAULT_EMAIL: admin@admin.com
   PGADMIN_DEFAULT_PASSWORD: admin
  ports:
   - "8080:80"
  depends_on:
   - postgres_db

 flask_app:
  build: .
  container_name: flask_app
  restart: always
  ports:
   - "5000:5000"
  depends_on:
   - postgres_db

volumes:
 postgres_data:
